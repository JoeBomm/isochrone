# Cloudflare Workers configuration for Isochrone Center Point RedwoodSDK Migration
name = "isochrone-center-point"
main = "dist/worker.js"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# Worker configuration
[build]
command = "npm run build"
cwd = "."
watch_dir = ["src", "worker.ts"]

# D1 Database bindings - Primary database for application data
[[d1_databases]]
binding = "DB"
database_name = "isochrone_db"
database_id = "your-d1-database-id"  # Replace with actual D1 database ID from: wrangler d1 create isochrone_db
migrations_dir = "./migrations"

# KV namespace bindings for caching external API responses
[[kv_namespaces]]
binding = "CACHE"
id = "your-kv-namespace-id"  # Replace with actual KV namespace ID from: wrangler kv:namespace create "CACHE"
preview_id = "your-kv-preview-id"  # Replace with preview KV namespace ID from: wrangler kv:namespace create "CACHE" --preview

# R2 bucket bindings for static assets and file storage (optional)
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "isochrone-assets"
preview_bucket_name = "isochrone-assets-preview"

# Analytics Engine for performance monitoring and usage tracking
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "isochrone_analytics"

# Environment variables (non-sensitive configuration)
[vars]
NODE_ENV = "production"
APP_VERSION = "1.0.0"
API_BASE_URL = "https://isochrone-center-point.your-domain.workers.dev"
# Cache TTL settings
ISOCHRONE_CACHE_TTL = "3600"  # 1 hour
MATRIX_CACHE_TTL = "7200"     # 2 hours
GEOCODING_CACHE_TTL = "86400" # 24 hours
# Rate limiting
MAX_LOCATIONS_PER_REQUEST = "10"
MAX_TRAVEL_TIME_MINUTES = "60"

# Performance and resource limits
[limits]
cpu_ms = 30000  # 30 seconds max CPU time for complex calculations

# Placement configuration for optimal global performance
[placement]
mode = "smart"

# Observability and monitoring
[observability]
enabled = true

# Development environment configuration
[env.development]
name = "isochrone-center-point-dev"
vars = {
  NODE_ENV = "development",
  API_BASE_URL = "https://isochrone-center-point-dev.your-domain.workers.dev",
  ISOCHRONE_CACHE_TTL = "1800",  # 30 minutes for faster development iteration
  MATRIX_CACHE_TTL = "3600",     # 1 hour
  GEOCODING_CACHE_TTL = "43200", # 12 hours
  MAX_LOCATIONS_PER_REQUEST = "15",  # Allow more for testing
  MAX_TRAVEL_TIME_MINUTES = "90"     # Allow longer times for testing
}

# Development D1 database
[[env.development.d1_databases]]
binding = "DB"
database_name = "isochrone_db_dev"
database_id = "your-d1-dev-database-id"  # Replace with dev D1 database ID
migrations_dir = "./migrations"

# Development KV namespace
[[env.development.kv_namespaces]]
binding = "CACHE"
id = "your-dev-kv-namespace-id"  # Replace with dev KV namespace ID

# Staging environment configuration
[env.staging]
name = "isochrone-center-point-staging"
vars = {
  NODE_ENV = "staging",
  API_BASE_URL = "https://isochrone-center-point-staging.your-domain.workers.dev",
  ISOCHRONE_CACHE_TTL = "3600",  # 1 hour
  MATRIX_CACHE_TTL = "7200",     # 2 hours
  GEOCODING_CACHE_TTL = "86400", # 24 hours
  MAX_LOCATIONS_PER_REQUEST = "10",
  MAX_TRAVEL_TIME_MINUTES = "60"
}

# Staging D1 database
[[env.staging.d1_databases]]
binding = "DB"
database_name = "isochrone_db_staging"
database_id = "your-d1-staging-database-id"  # Replace with staging D1 database ID
migrations_dir = "./migrations"

# Staging KV namespace
[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "your-staging-kv-namespace-id"  # Replace with staging KV namespace ID

# Production environment (default configuration above applies)
[env.production]
name = "isochrone-center-point"
vars = {
  NODE_ENV = "production",
  API_BASE_URL = "https://isochrone-center-point.your-domain.workers.dev",
  ISOCHRONE_CACHE_TTL = "3600",  # 1 hour
  MATRIX_CACHE_TTL = "7200",     # 2 hours
  GEOCODING_CACHE_TTL = "86400", # 24 hours
  MAX_LOCATIONS_PER_REQUEST = "10",
  MAX_TRAVEL_TIME_MINUTES = "60"
}

# Custom domains configuration (configure after initial deployment)
# Uncomment and configure these after setting up custom domains in Cloudflare
# [[routes]]
# pattern = "isochrone.yourdomain.com/*"
# zone_name = "yourdomain.com"

# [[env.production.routes]]
# pattern = "isochrone.yourdomain.com/*"
# zone_name = "yourdomain.com"

# Worker-specific configuration
[worker]
# Enable ES modules format for modern JavaScript features
format = "modules"

# Compatibility settings for Node.js APIs
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# Usage model - "standard" for most applications, "unbound" for CPU-intensive workloads
usage_model = "standard"

# Tail workers for logging and monitoring (optional)
# [[tail_consumers]]
# service = "isochrone-logs"
# environment = "production"
